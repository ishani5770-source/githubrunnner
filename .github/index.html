<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sample Website</title>
    <!-- Link to an external CSS stylesheet (optional) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section: Contains navigation links -->
    <header>
        <h1>Welcome to My Website</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Section -->
    <main>
        <section id="home">
            <h2>Home Section</h2>
            <p>This is a basic paragraph displaying content on your first web page.</p>
        </section>

        <section id="about">
            <h2>About Me</h2>
            <p>You can add your bio, details, or project descriptions here.</p>
        </section>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 My Sample Website. All rights reserved.</p>
    </footer>

</body>
</html>
